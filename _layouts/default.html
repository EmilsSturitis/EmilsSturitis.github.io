<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #fff;
        }
        
        .header {
            background: #fff;
            border-bottom: 1px solid #e1e5e9;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0066cc;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        
        .nav-menu a {
            text-decoration: none;
            color: #666;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #0066cc;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .hero {
            text-align: center;
            padding: 4rem 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin-bottom: 3rem;
        }
        
        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 1rem;
        }
        
        .hero p {
            font-size: 1.2rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .blog-post {
            background: #fff;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .blog-post:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .blog-post h3 {
            color: #0066cc;
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }
        
        .blog-post h3 a {
            color: #0066cc;
            text-decoration: none;
        }
        
        .blog-post h3 a:hover {
            text-decoration: underline;
        }
        
        .blog-post p {
            color: #666;
            margin-bottom: 1rem;
        }
        
        .blog-post .date {
            font-size: 0.9rem;
            color: #999;
        }
        
        .about-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .about-content h1, .about-content h2 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        
        .about-content p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .skill-tag {
            background: #e3f2fd;
            color: #0066cc;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }
        
        /* Post styles */
        .post {
            max-width: 800px;
            margin: 2rem auto;
        }
        
        .post-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e1e5e9;
        }
        
        .post-header h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .post-meta {
            color: #666;
            font-size: 0.9rem;
        }
        
        .post-content {
            margin-bottom: 3rem;
        }
        
        .post-content h2, .post-content h3, .post-content h4 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #333;
        }
        
        .post-content p {
            margin-bottom: 1rem;
        }
        
        .post-nav {
            display: flex;
            justify-content: space-between;
            padding-top: 2rem;
            border-top: 1px solid #e1e5e9;
        }
        
        .post-nav a {
            color: #0066cc;
            text-decoration: none;
        }
        
        .post-nav a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <a href="{{ '/' | relative_url }}" class="logo">{{ site.title | default: "Your Blog" }}</a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="{{ '/' | relative_url }}" class="nav-link">Home</a></li>
                    <li><a href="{{ '/blog' | relative_url }}" class="nav-link">Blog</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <main>
        {{ content }}
    </main>
    
    <footer>
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title | default: "Your Blog" }}. All rights reserved.</p>
    </footer>
    
    <script>
        // Add active class to current page nav link
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-link');
            const currentPath = window.location.pathname;
            
            navLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (currentPath === linkPath || (currentPath.endsWith('/') && currentPath === linkPath + '/')) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
